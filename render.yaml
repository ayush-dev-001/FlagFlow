# Render Blueprint (PLAN.md phase 9). One web service runs the API and serves the built dashboard from
# the same origin, so the refresh cookie stays first-party (owner decision, 2026-10-26). demo-api calls
# its public URL. demo-web is deployed on Vercel (apps/demo-web/vercel.json).
#
# Set in the dashboard after the first sync (sync: false): BREVO_API_KEY (or RESEND_API_KEY), MAIL_FROM,
# SUPERADMIN_EMAIL, and on the demo
# backend FLAGFLOW_URL, FLAGFLOW_API_KEY and DEMO_WEB_ORIGIN. See DEPLOY.md.

services:
  - type: web
    name: flagflow
    runtime: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: >-
      npm ci --include=dev &&
      npm run build -w packages/shared -w packages/flag-client &&
      npm run build -w apps/api &&
      VITE_API_URL=/api npm run build -w apps/dashboard
    # Migrations and the idempotent seed (superadmin and the Acme demo org) run before each start.
    startCommand: >-
      npm run db:deploy -w apps/api &&
      npm run db:seed -w apps/api &&
      node apps/api/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: flagflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: flagflow-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_TTL_DAYS
        value: '7'
      # DASHBOARD_ORIGIN defaults to this service's own URL (RENDER_EXTERNAL_URL).
      - key: DASHBOARD_DIST
        value: apps/dashboard/dist
      # Render's load balancer is the one proxy hop in front of the app.
      - key: TRUST_PROXY
        value: '1'
      # Invite email through Resend's HTTPS API. Render's free plan blocks outbound SMTP ports, so use this
      # rather than SMTP_URL there. (SMTP_URL still works on hosts that allow SMTP.)
      # Brevo delivers to anyone once MAIL_FROM is a sender verified in Brevo, with no domain needed. If both are
      # set, Brevo is used. Resend without a verified domain only reaches its own account address.
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # The verified sender, e.g. FlagFlow <you@gmail.com> (Brevo) or FlagFlow <onboarding@resend.dev> (Resend).
      - key: MAIL_FROM
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        generateValue: true
      - key: DEMO_ADMIN_EMAIL
        value: admin@acme.test
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true

  - type: web
    name: flagflow-demo-api
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: >-
      npm ci --include=dev &&
      npm run build -w packages/shared -w packages/flag-client &&
      npm run build -w apps/demo-api
    startCommand: node apps/demo-api/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      # The flagflow service's public URL, e.g. https://flagflow.onrender.com. (Free services can't receive
      # private-network traffic; on a paid plan, FLAGFLOW_HOSTPORT from fromService.hostport also works.)
      - key: FLAGFLOW_URL
        sync: false
      # An API key for the Acme org: create it in the deployed dashboard, Settings → API keys.
      - key: FLAGFLOW_API_KEY
        sync: false
      # The demo-web URL on Vercel, e.g. https://flagflow-demo.vercel.app
      - key: DEMO_WEB_ORIGIN
        sync: false

  - type: keyvalue
    name: flagflow-redis
    plan: free
    # Sessions, the token denylist and rate-limit counters live here: never evict them.
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: flagflow-db
    plan: free
    databaseName: flagflow
    user: flagflow
