[extend]
useDefault = true

[allowlist]
description = "Dependencies, build output and local tool folders"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)\.git/''',
  '''(^|/)\.claude/''',
  '''(^|/)\.agents/''',
  '''(^|/)\.aider-desk/''',
  # Impeccable's local roll cache: its "key" is a design-roll reproduction id, not a credential.
  '''(^|/)\.impeccable/questions/''',
  # The reference collection `postman spec generate` builds from the OpenAPI spec: its example bodies hold
  # random strings the generator invents (flag keys, IDs), which the generic-api-key rule mistakes for keys.
  # Hand-written collections (FlagFlow Smoke, FlagFlow Load) stay scanned.
  '''(^|/)postman/collections/FlagFlow API/''',
  '''(^|/)\.env$''',
]
