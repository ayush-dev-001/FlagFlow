$kind: http-request
method: GET
url: '{{baseUrl}}/api/health'
order: 1000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('API, Postgres and Redis are up', () => {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body.status).to.eql('ok');
        pm.expect(body.checks).to.eql({ postgres: 'ok', redis: 'ok' });
      });
