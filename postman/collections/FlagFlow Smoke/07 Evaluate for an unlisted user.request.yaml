$kind: http-request
method: GET
url: '{{baseUrl}}/v1/flags/smoke_flag/evaluate?userId=U002'
order: 7000
auth:
  type: noauth
headers:
  - key: x-api-key
    value: '{{apiKey}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('U002 is not listed, so it does not get the flag', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().enabled).to.eql(false);
      });
