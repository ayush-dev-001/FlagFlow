$kind: http-request
description: ""
url: "{{baseUrl}}/api/team/members/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: string
    disabled: false
    description: "(Required) "
body:
  type: json
  content: |-
    {
      "role": "ADMIN",
      "isActive": false
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Change a member's role or active status (admin).resources/examples
order: 2000
