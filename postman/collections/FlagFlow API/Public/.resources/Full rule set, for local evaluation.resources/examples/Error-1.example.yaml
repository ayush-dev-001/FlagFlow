$kind: http-example
name: Error
request:
  url: "{{baseUrl}}/v1/snapshot"
  method: GET
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "string",
          "message": "string",
          "details": ""
        }
      }
order: 3000
