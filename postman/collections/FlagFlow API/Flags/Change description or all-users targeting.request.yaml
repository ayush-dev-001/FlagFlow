$kind: http-request
description: ""
url: "{{baseUrl}}/api/flags/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: string
    disabled: false
    description: "(Required) "
body:
  type: json
  content: |-
    {
      "description": "string",
      "targetAll": false
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Change description or all-users targeting.resources/examples
order: 5000
