$kind: http-example
request:
  url: "{{baseUrl}}/api/flags"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "key": "99_0cdx0nopkdghq0d",
        "description": "",
        "targetAll": false,
        "targets": [
          "K-OgR9",
          "I"
        ]
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "string",
          "message": "string",
          "details": ""
        }
      }
order: 2000
