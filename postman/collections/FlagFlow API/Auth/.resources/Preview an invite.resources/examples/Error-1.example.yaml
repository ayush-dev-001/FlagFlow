$kind: http-example
name: Error
request:
  url: "{{baseUrl}}/api/auth/invites/:token"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    - key: token
      value: string
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "string",
          "message": "string",
          "details": ""
        }
      }
order: 3000
