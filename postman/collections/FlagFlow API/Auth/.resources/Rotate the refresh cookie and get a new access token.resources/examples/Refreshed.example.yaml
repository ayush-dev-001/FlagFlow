$kind: http-example
request:
  url: "{{baseUrl}}/api/auth/refresh"
  method: POST
  headers:
    - key: ff_refresh
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-Requested-With
      value: string
      disabled: false
      description: "(Required) "
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "accessToken": "string",
        "expiresIn": 7247823670083583
      }
order: 1000
