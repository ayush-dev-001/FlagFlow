$kind: http-example
name: Error
request:
  url: "{{baseUrl}}/api/auth/invites/:token/accept"
  method: POST
  headers:
    Accept: application/json
  pathVariables:
    - key: token
      value: string
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "name": "string",
        "password": "stringstring"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "string",
          "message": "string",
          "details": ""
        }
      }
order: 4000
