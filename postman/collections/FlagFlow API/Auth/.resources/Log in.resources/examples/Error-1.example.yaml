$kind: http-example
name: Error
request:
  url: "{{baseUrl}}/api/auth/login"
  method: POST
  headers:
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "string",
        "password": "string"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "string",
          "message": "string",
          "details": ""
        }
      }
order: 3000
