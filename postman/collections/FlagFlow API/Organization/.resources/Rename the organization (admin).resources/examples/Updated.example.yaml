$kind: http-example
request:
  url: "{{baseUrl}}/api/org"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "name": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "organization": {
          "id": "d5A7Eb4d-AAbA-1fe2-b4c4-4cd73ECFd159",
          "name": "string",
          "slug": "string"
        }
      }
order: 1000
